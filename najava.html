<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Travel Planer</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <header>
        
        <p>Travel Planer</p>
        <div class="meni">
            <a href="pocetna.html">Почетна</a>
            <a href="destinacii.html">Дестинации</a>
            <a href="galerija.html">Галерија</a>
            <a href="anketa.html">Анкета</a>
            <a href="najava.html">Најава</a>
        </div>
    </header>

    <hr>


    <main class="najava">

        <div class="najava-cover">

            <h1>Добредојдовте!</h1>

            <p>Најавете се на вашиот Travel Planner профил.</p>

        </div>


        <div class="najava-form">

            <h2>Најава</h2>

            <form id="formaNajava">

                <label for="email">Е-пошта:</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Внесете ја вашата е-пошта"
                       required>


                <label for="password">Лозинка:</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Внесете ја вашата лозинка"
                       required>


                <button type="submit">Најави се</button>

            </form>


            <div id="uspesnaNajava" class="uspesna-najava">

                <h3>Успешно најавување!</h3>


            </div>

        </div>

    </main>


    <hr>

        <footer>
            <p> © 2026 Travel Planner</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
